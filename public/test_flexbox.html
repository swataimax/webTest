<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<style>
	body {
		background-color: #f2f2f2;
	}
	div div {
		font-weight: 700;
		margin: 2px;
		width: 2em;
		text-align: center;
		background-color: #d0d0d0;
		border-color: white;
		border-width: thick;
		border-style: solid;
	}
		
	.container_center {
	  display: flex;
	  justify-content: center;
	}
	.container_start {
	  display: flex;
	  justify-content: flex-start;
	}
	.container_end {
	  display: flex;
	  justify-content: flex-end;
	}
	.container_between {
	  display: flex;
	  justify-content: space-between;
	}
	.container_around {
	  display: flex;
	  justify-content: space-around;
	}
</style>
</head>
<body>
	<hr>
	
	<div class="no_container">
		<div>A</div>
		<div>B</div>
		<div>C</div>
		<div>D</div>
	</div>
	
	<hr>
	
	<div class="container_center">
		<div>A</div>
		<div>B</div>
		<div>C</div>
		<div>D</div>
	</div>
	
	<hr>
	
	<div class="container_start">
		<div>A</div>
		<div>B</div>
		<div>C</div>
		<div>D</div>
	</div>
	
	<hr>
	
	<div class="container_end">
		<div>A</div>
		<div>B</div>
		<div>C</div>
		<div>D</div>
	</div>
	
	<hr>
	
	<div class="container_between">
		<div>A</div>
		<div>B</div>
		<div>C</div>
		<div>D</div>
	</div>
	
	<hr>
	
	<div class="container_around">
		<div>A</div>
		<div>B</div>
		<div>C</div>
		<div>D</div>
	</div>
	  
	  
</body>
</html>
