<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<style>

	.header {
	  width: 100%;
	  padding-top: 10px;
	  padding-bottom: 10px;
	  background: orange;
	  position: fixed;
	  top: 0;
	  left: 0;
	}
	.header__inner {
	  padding-right: 20px;
	  padding-left: 20px;
	  display: flex;
	  align-items: center;
	}
	.header__title {
	  display: block;
	  width: 100%;
	  font-size: 14px;
	  flex-shrink:0;
	  max-width: 80px;
	}
	.header__nav {
	  width: 100%;
	}
	.nav__items {
	  display: flex;
	  align-items: center;
	  justify-content: flex-end;
	}
	.nav__item {
	  list-style: none;
	  margin-right: 10px;
	  font-size: 12px;
	}
	.nav__item:last-child {
	  margin-right: 0;
	}
	.contents {
	  height: 2000px;
	  width: 100%;
	  background: rgb(255,201,114);
	  background: linear-gradient(118deg, rgba(255,201,114,1) 0%, rgba(246,179,84,1) 40%, rgba(231,229,97,1) 100%);
	}
	
	.back-to-top {
	  z-index: 100;
	  position: fixed;
	  right: 30px; /* 画面右から30px */
	  bottom: 80px; /* 画面下から80px */
	  width: 40px;
	  height: 40px;
	  border: 1px solid #ffffff;
	  border-radius: 50%;
	  background: blue;
	  cursor: pointer;
	}
	.back-to-top a {
	  display: inline-block;
	  position: relative;
	  width: 100%;
	  height: 100%;
	}
	.back-to-top a:before {
	  position: absolute;
	  width: 10px;
	  height: 10px;
	  transform: rotate(-45deg);
	  border-top: solid 2px #ffffff;
	  border-right: solid 2px #ffffff;
	  content: "";
	  transform: rotate(-45deg) translate(-17%, -50%);
	  top: 50%;
	  left: 50%;
	}
	/* 矢印はborder-topとborder-rightで表現し、transformで回転させ、位置調整 */
	
	.button-wrap {
		z-index: 100;
		position: fixed;
		left: 0; /* 画面左端に固定 */
		bottom: 0; /* 画面下に固定 */
		width: 100%;
		padding-top: 20px;
		padding-bottom: 20px;
		background: #fff;
	}
	.button {
		width: 100%;
		max-width: 280px;
		height: 40px;
		margin-right: auto;
		margin-left: auto;
		background: orange;
		display: block;
	}
	
</style>
</head>

<body>

	<!-- ヘッダーを固定 -->
	<header class="header">
	  <div class="header__inner">
	    <h1 class="header__title">ロゴ</h1>
	      <nav class="header__nav">
	        <ul class="nav__items">
	          <li class="nav__item">メニュー</li>
	          <li class="nav__item">メニュー</li>
	          <li class="nav__item">メニュー</li>
	        </ul>
	     </nav>
	   </div>
	</header>
	<main>
		<div class="contents">
		</div>
	</main>
	
	
	<!-- トップに戻るボタンを右下に固定 -->
	<div class="back-to-top" id="page-top">
		<a href=""></a>
	</div>
	
	
	<!--フッターに追従させるボタン-->
	<footer></footer>
	<div class="button-wrap">
		<button class="button">追従ボタン</button>
	</div>
	
	
	
</body>
